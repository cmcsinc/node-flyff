name: CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ──────────────────────────────────────────────
  # Job 1: Lint & Type-check
  # ──────────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type-check all packages
        run: pnpm -r exec tsc --noEmit

      - name: Lint all packages
        run: pnpm -r lint

  # ──────────────────────────────────────────────
  # Job 2: Build
  # ──────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/*/dist
          retention-days: 1

  # ──────────────────────────────────────────────
  # Job 3: Test (matrix across DB adapters)
  # ──────────────────────────────────────────────
  test:
    name: Test (${{ matrix.db }})
    runs-on: ubuntu-latest
    needs: build
    strategy:
      fail-fast: false
      matrix:
        db: [sqlite3, pg]
        node: ['20', '22']

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flyff_test
          POSTGRES_USER: flyff
          POSTGRES_PASSWORD: flyff_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist

      - name: Run migrations (${{ matrix.db }})
        run: pnpm --filter @flyff/database migrate
        env:
          DB_CLIENT: ${{ matrix.db }}
          DB_FILENAME: ./data/test.sqlite3
          DATABASE_URL: postgresql://flyff:flyff_test@localhost:5432/flyff_test
          IPC_SECRET: test-secret

      - name: Run tests
        run: pnpm -r test
        env:
          DB_CLIENT: ${{ matrix.db }}
          DB_FILENAME: ./data/test.sqlite3
          DATABASE_URL: postgresql://flyff:flyff_test@localhost:5432/flyff_test
          REDIS_URL: redis://localhost:6379
          IPC_SECRET: test-secret
          LOG_LEVEL: silent
