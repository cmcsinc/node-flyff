regions:
  # NOTE: the bogus "Flaris Safe Zone" (x6800-7200, z3100-3600) was removed -- it
  # was centered on the revival point (6978,3329) which sits in the Captain
  # Mushpang field, NOT in Flaris town (NPCs cluster at x~2800-3700, z~2100-3100).
  # With it present, every mushpang-field swing tripped the v19 RA_SAFETY gate
  # (AIMonster.cpp:1622) -> monster dropped target, snapped home, and silent-
  # full-healed every tick -> unkillable except by a one-shot crit. The C++ gate
  # is correct; the region DATA was wrong. Re-add a safe region ONLY after
  # extracting real RA_SAFETY AABBs from WdMadrigal.rgn.
  # WARNING: extractFlaris rewrites this file via YAML stringify, which DROPS
  # comments. Re-add this note after any `pnpm extract:flaris` run.
  - id: 2
    name: Flaris PVP Arena
    type: pvp
    bounds:
      min:
        x: 6600
        y: 0
        z: 2900
      max:
        x: 6750
        y: 500
        z: 3050
weather:
  default: sunny
  variations:
    - type: rain
      chance: 0.1
      duration: 300
    - type: thunder
      chance: 0.02
      duration: 180
